name: Build ВОнтакте APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Show Android signing fingerprints
        run: gradle :app:signingReport --no-daemon
      # Release build is signed with the standard debug key for direct tablet testing.
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VOntakte-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
